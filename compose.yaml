# Local Postgres for developing and testing the auth service.
#   bun install && docker compose up -d --wait   (set POSTGRES_PORT if 5432 is taken, e.g. 5433)
#   docker compose down -v                       (also drops the data, so the init script runs again)
# One Postgres per Region (ADR 0007). The roles are created by the init script of the pinned
# tula-closeline-db library, which `bun install` puts in node_modules. The passwords below are
# LOCAL DEVELOPMENT ONLY: real environments create the roles in tula-closeline-infra.
# The port binds to 127.0.0.1 only, because Docker bypasses host firewalls.
services:
  postgres:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      # The bootstrap superuser. Nothing but the init script connects as it.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_local
      POSTGRES_DB: closeline
      # LOCAL ONLY. Read by the library's init.sh, which hands them to init.sql.
      CLOSELINE_OWNER_PASSWORD: closeline_owner_local
      CLOSELINE_AUTH_PASSWORD: closeline_auth_local
      CLOSELINE_CORE_PASSWORD: closeline_core_local
      CLOSELINE_PLAYBOOK_PASSWORD: closeline_playbook_local
      CLOSELINE_VOICE_PASSWORD: closeline_voice_local
      CLOSELINE_OUTBOUND_PASSWORD: closeline_outbound_local
    ports: ['127.0.0.1:${POSTGRES_PORT:-5432}:5432']
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./node_modules/tula-closeline-db/docker/postgres/init.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
      - ./node_modules/tula-closeline-db/docker/postgres/init.sql:/etc/closeline/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d closeline']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
